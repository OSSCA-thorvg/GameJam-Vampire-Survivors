# Production game server (ADRs 0017, 0023): the `runtime` image built on the owner's host from this clone, run as
# exactly one instance there. Usage, from the repository root (deploy/server/README.md):
#   cp deploy/server/.env.example deploy/server/.env    # once, then edit
#   NODE_VERSION=$(cat .nvmrc) docker compose -f deploy/server/compose.yaml up -d --build
services:
  server:
    # The same `runtime` target CI's `server image` job gates (ADR 0010): non-root node, production dependencies only,
    # HEALTHCHECK on /healthz. The Dockerfile pins the base by digest; NODE_VERSION comes from .nvmrc (the fallback
    # only lets `ps`, `logs` and `down` run without it).
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
      target: runtime
      args: { NODE_VERSION: '${NODE_VERSION:-24}' }
    image: vs-server:local
    # Rooms live in memory (ADR 0006): one container, never scaled.
    container_name: vs-server
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: '8787'
    # Published on loopback only: the reverse proxy on the same host terminates TLS and forwards to it.
    # VS_BIND=0.0.0.0 publishes it on every interface (only for a plain-HTTP trial, see the README).
    ports: ['${VS_BIND:-127.0.0.1}:${VS_HOST_PORT:-8787}:8787']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
