# GitHub Actions only (ADR 0011). npm is intentionally not managed by Dependabot: its PRs would propose
# versions younger than pnpm's minimumReleaseAge (7 days) and fail install. Update npm deps deliberately with pnpm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore:'
    labels:
      - 'type:chore'
      - 'priority:low'
      - 'area:infra'
      - 'status:review'
