name: CI

on:
  pull_request:
    # ready_for_review re-runs CI when a draft is released, so the auto-merge workflow (ADR 0012) re-evaluates it.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The auto-merge workflow dispatches CI on main after each merge: merges made with GITHUB_TOKEN do not trigger push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Code quality gate (ADR 0002). Skipped until the monorepo exists (roadmap F1), then always required.
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect workspace
        id: ws
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet (before F1): skipping code checks."; fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from packageManager)
        if: steps.ws.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ws.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies (ADR 0011)
        if: steps.ws.outputs.present == 'true'
        run: pnpm audit --audit-level=high
      - name: format:check, lint, typecheck, test, build
        if: steps.ws.outputs.present == 'true'
        run: pnpm check

  # verify-game smoke run (#31): launches the client on :5180 and drives e2e/ with Playwright Chromium (headless,
  # SwiftShader WebGL 2). The browser comes from the explicit `playwright install` step, never a lifecycle script.
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect workspace
        id: ws
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet: skipping verify."; fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from packageManager)
        if: steps.ws.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ws.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        if: steps.ws.outputs.present == 'true'
        id: pw
        run: |
          version=$(sed -n "s/^  '@playwright\/test@\([0-9][^']*\)':$/\1/p" pnpm-lock.yaml | head -1)
          [ -n "$version" ] || { echo "::error::@playwright/test is not in pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.ws.outputs.present == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium for Playwright
        if: steps.ws.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: pnpm verify:e2e
        if: steps.ws.outputs.present == 'true'
        run: pnpm verify:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.ws.outputs.present == 'true'
        with:
          name: verification
          path: verification/
          include-hidden-files: true
          retention-days: 7

  # Repository rules that hold from the first commit (.claude/rules/*.md).
  repo-rules:
    name: repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: labels.json is valid and uses known prefixes
        run: |
          jq -e 'type == "array" and all(.[]; (.name | test("^(status|type|priority|area|phase):[a-z0-9-]+$")) and (.color | test("^[0-9A-Fa-f]{6}$")))' .github/labels.json > /dev/null
      - name: Every ADR is listed in docs/adr/README.md
        run: |
          missing=0
          for f in docs/adr/[0-9][0-9][0-9][0-9]-*.md; do
            name=$(basename "$f")
            grep -q "($name)" docs/adr/README.md || { echo "::error file=$f::$name is not listed in docs/adr/README.md"; missing=1; }
          done
          exit $missing
      - name: CLAUDE.md mentions every rule and skill (docs-sync)
        run: |
          missing=0
          for f in .claude/rules/*.md; do
            n=$(basename "$f")
            grep -qF "$n" CLAUDE.md || { echo "::error file=CLAUDE.md::rule $n is not mentioned in CLAUDE.md"; missing=1; }
          done
          for d in .claude/skills/*/; do
            n=$(basename "$d")
            grep -qF "\`$n\`" CLAUDE.md || { echo "::error file=CLAUDE.md::skill $n is not mentioned in CLAUDE.md"; missing=1; }
          done
          exit $missing
      - name: Node version is pinned
        run: grep -Eq '^[0-9]+' .nvmrc
      - name: Supply-chain settings are intact (ADR 0011)
        run: |
          grep -Eq '^minimumReleaseAge: *10080 *$' pnpm-workspace.yaml || { echo "::error file=pnpm-workspace.yaml::minimumReleaseAge must stay 10080"; exit 1; }
          grep -Eq '^allowBuilds:' pnpm-workspace.yaml || { echo "::error file=pnpm-workspace.yaml::allowBuilds policy is missing"; exit 1; }
      - name: Every action is pinned to a commit SHA (ADR 0011)
        run: |
          unpinned=$(grep -nE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)' || true)
          [ -z "$unpinned" ] || { echo "::error::Unpinned actions:"; echo "$unpinned"; exit 1; }

  # The server's runtime image builds and answers /healthz as the non-root node user (ADR 0010, .claude/rules/docker.md).
  # Uses the runner's Docker directly (BuildKit is the default builder), so no third-party actions are needed.
  # Docker container names need at least two characters, so the container is vs-server-ci.
  server-image:
    name: server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect server changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$BASE"; else range="HEAD~1"; fi
          changed=$(git diff --name-only "$range" HEAD)
          if printf '%s\n' "$changed" | grep -Eq '^(packages/server/|packages/shared/|compose\.yaml$|\.dockerignore$|pnpm-lock\.yaml$|\.nvmrc$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipped: no server changes"
          fi
      - name: Build the runtime image
        if: steps.changes.outputs.run == 'true'
        run: docker build --target runtime --build-arg NODE_VERSION=$(cat .nvmrc) -t vs-server:ci -f packages/server/Dockerfile .
      - name: /healthz answers inside the container
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run -d --name vs-server-ci -p 8787:8787 vs-server:ci
          for i in $(seq 20); do curl -fsS localhost:8787/healthz && echo && exit 0; sleep 1; done
          echo "::error::/healthz did not answer within 20 s"; exit 1
      - name: The container becomes healthy
        if: steps.changes.outputs.run == 'true'
        run: |
          for i in $(seq 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' vs-server-ci)
            [ "$status" = healthy ] && { echo "healthy"; exit 0; }
            sleep 1
          done
          echo "::error::container health is '$status' after 30 s"; exit 1
      - name: The container runs as node
        if: steps.changes.outputs.run == 'true'
        run: |
          user=$(docker exec vs-server-ci id -un)
          [ "$user" = node ] || { echo "::error::container runs as '$user', expected node"; exit 1; }
          echo "user: $user"
      - name: Container logs
        if: failure() && steps.changes.outputs.run == 'true'
        run: docker logs vs-server-ci

  # PR conventions (.claude/rules/pull-requests.md, commits.md).
  pr-rules:
    name: PR rules
    # Dependabot's action-bump PRs have no issue; repo rules and pnpm check still gate them.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # read the linked issue and its dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No "(#N)" suffix: GitHub appends " (#<PR>)" to the squash commit itself; the issue link is "Closes #N" in the body.
      - name: 'Title is "<prefix>: <summary>" within 72 characters, without a "(#N)" suffix'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|update|refactor|test|docs|chore): .+' || { echo "::error::PR title must be '<prefix>: <summary>'"; exit 1; }
          if echo "$TITLE" | grep -Eq '\(#[0-9]+\)[[:space:]]*$'; then echo "::error::PR title must not end in '(#N)': GitHub appends the PR number to the squash commit, and 'Closes #N' in the body links the issue"; exit 1; fi
          [ "${#TITLE}" -le 72 ] || { echo "::error::PR title is longer than 72 characters"; exit 1; }
      - name: Body closes an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' || { echo "::error::PR body must contain 'Closes #N'"; exit 1; }
      - name: Body closes exactly one issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # GitHub treats closing keywords anywhere in the body (even inside code spans) as links, so a quoted
          # "Closes #2" in a test note would close issue 2 on merge. Allow exactly one distinct closed issue.
          nums=$(printf '%s\n' "$BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' | sort -un | tr '\n' ' ' | sed 's/ *$//' || true)
          count=$(printf '%s' "$nums" | wc -w | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "::error::PR body closes several issues (#${nums// / #}). Keep only the final 'Closes #N' line; rephrase quoted examples so no closing keyword is followed by another issue number."
            exit 1
          fi
      - name: Linked issue has no open dependencies
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Only closing keywords at the start of a line count (e.g. the final "Closes #N"), so issue numbers
          # quoted elsewhere in the body (test notes, examples) are not mistaken for the linked issue.
          issues=$(printf '%s\n' "$BODY" | tr -d '\r' | grep -oiE '^(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+$' | sort -un || true)
          [ -n "$issues" ] || { echo "No linked issue found (the 'Body closes an issue' step reports this)."; exit 0; }
          bad=0
          for issue in $issues; do
            deps=$(gh api "repos/$REPO/issues/$issue" --jq .body | tr -d '\r' \
              | awk '/^## Depends on/{f=1;next} /^## /{f=0} f' | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)
            open=""
            for d in $deps; do
              [ "$(gh api "repos/$REPO/issues/$d" --jq .state)" = open ] && open="$open #$d"
            done
            if [ -n "$open" ]; then
              echo "::error::Issue #$issue still has open prerequisites:$open. Finish them first (issue-start prerequisite gate, .claude/rules/issues.md)."
              bad=1
            else
              echo "Issue #$issue: all dependencies closed (${deps:-none})."
            fi
          done
          exit $bad
      - name: Linked issue was started with issue-start
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Issue work starts only with the issue-start skill, which assigns the issue and posts a start comment
          # carrying the hidden marker below (CLAUDE.md, .claude/skills/issue-start).
          issues=$(printf '%s\n' "$BODY" | tr -d '\r' | grep -oiE '^(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+$' | sort -un || true)
          [ -n "$issues" ] || { echo "No linked issue found (the 'Body closes an issue' step reports this)."; exit 0; }
          bad=0
          for issue in $issues; do
            assignees=$(gh api "repos/$REPO/issues/$issue" --jq '.assignees | length')
            marker=$(gh api --paginate "repos/$REPO/issues/$issue/comments" --jq '.[].body' | grep -cF '<!-- issue-start -->' || true)
            if [ "$assignees" -eq 0 ]; then
              echo "::error::Issue #$issue has no assignee. Start issues only with the issue-start skill."; bad=1
            fi
            if [ "$marker" -eq 0 ]; then
              echo "::error::Issue #$issue has no issue-start comment (marker '<!-- issue-start -->'). Start issues only with the issue-start skill."; bad=1
            fi
            [ "$bad" -eq 0 ] && echo "Issue #$issue: started with issue-start (assignee and marker present)."
          done
          exit $bad
      - name: Body has Impact and Verification sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # A section counts only if a non-blank line that is not an HTML comment follows its heading
          # before the next "## " heading (an unfilled template fails). See .claude/rules/verification.md.
          bad=0
          for section in Impact Verification; do
            content=$(printf '%s\n' "$BODY" | tr -d '\r' | awk -v h="## $section" '
              $0 == h { inside = 1; next }
              inside && /^## / { exit }
              inside { print }' | sed -e 's/<!--.*-->//g' | grep -v '^[[:space:]]*$' || true)
            if ! printf '%s\n' "$BODY" | tr -d '\r' | grep -qx "## $section"; then
              echo "::error::PR body has no '## $section' section. Run the impact-check / verify-game steps of issue-finish and fill it in (.claude/rules/verification.md)."; bad=1
            elif [ -z "$content" ]; then
              echo "::error::PR body section '## $section' is empty. Fill it with the evidence from impact-check / verify-game (.claude/rules/verification.md)."; bad=1
            fi
          done
          exit $bad
      - name: Branch name is "<prefix>/issue-<N>-<slug>"
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "$HEAD_REF" | grep -Eq '^(feature|fix|update|refactor)/issue-[0-9]+-[a-z0-9-]+$' || { echo "::error::Branch must be '<prefix>/issue-<N>-<slug>'"; exit 1; }
      - name: Commit subjects follow the prefix rule and carry no AI attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while IFS= read -r subject; do
            echo "$subject" | grep -Eq '^(feat|fix|update|refactor|test|docs|chore): .+' || { echo "::error::Commit subject without prefix: $subject"; bad=1; }
            [ "${#subject}" -le 72 ] || { echo "::error::Commit subject over 72 characters: $subject"; bad=1; }
          done < <(git log --format=%s "$BASE..$HEAD")
          if git log --format=%B "$BASE..$HEAD" | grep -Eiq 'co-authored-by: .*(claude|anthropic|copilot|codex)|generated with \[?claude'; then
            echo "::error::Commit messages must not contain AI attribution"; bad=1
          fi
          exit $bad
      - name: Branch is one rebased commit (linear history, ADR 0012)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fix="Fix: rebase onto origin/main and squash into one commit (resolve-conflicts / issue-finish), then git push --force-with-lease."
          bad=0
          if ! git merge-base --is-ancestor "$BASE" "$HEAD"; then
            echo "::error::The branch does not contain the current tip of the base branch ($BASE). $fix"; bad=1
          fi
          merges=$(git rev-list --merges "$BASE..$HEAD")
          if [ -n "$merges" ]; then
            echo "::error::The branch contains merge commits: $(echo "$merges" | tr '\n' ' '). $fix"; bad=1
          fi
          count=$(git rev-list --count "$BASE..$HEAD")
          if [ "$count" -ne 1 ]; then
            echo "::error::The branch has $count commits on top of the base branch; it must have exactly one. $fix"; bad=1
          fi
          exit $bad
