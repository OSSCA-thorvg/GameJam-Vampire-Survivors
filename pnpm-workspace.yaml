packages:
  - 'packages/*'

# Supply-chain guard (ADR 0011): only resolve versions published at least 7 days ago (10080 minutes).
# Malicious releases are usually detected and unpublished within days; waiting a week avoids installing them.
minimumReleaseAge: 10080

# Fail `pnpm install` on a Node or pnpm version outside the root `engines` (ADR 0002). pnpm 11 reads its settings
# from this file and ignores `.npmrc` apart from auth and registry, so `.npmrc`'s `engine-strict=true` only covers npm.
engineStrict: true

# The ONLY way to bypass minimumReleaseAge. Every entry needs a comment with the reason and a link to the issue or ADR
# that approved it, e.g. an urgent security fix. Remove the entry once the version is older than 7 days.
minimumReleaseAgeExclude: []

# Security overrides. Every entry needs a comment with the advisory link, the reason and the approving issue.
# Remove an entry once every dependent's own range already resolves to a patched version.
overrides:
  # GHSA-g3hv-75wg-m249 (moderate, dev-only): minimatch >=7.0.0 <11.0.1 can be made to use excessive CPU and memory
  # by a crafted glob. ESLint 10.14.0, @eslint/config-array 0.23.5 and @typescript-eslint/typescript-estree 8.72.1
  # (all latest) still ask for ^10, and no 10.x release is patched. 11.0.3 is the newest patched release older than
  # minimumReleaseAge; ESLint only calls `new Minimatch(...).match()` and `minimatch()`, which 11 keeps (#67).
  'minimatch@<11.0.1': 11.0.3

# Dependency lifecycle scripts (preinstall/install/postinstall) are a common supply-chain attack vector.
# pnpm 11 fails `pnpm install` when a dependency wants to run a script that is not listed here.
# Every entry needs a reason; prefer `false` when the package works without its script.
allowBuilds:
  # esbuild (via Vite/tsx): its postinstall only verifies/optimizes the platform binary; the binary comes from
  # an optional dependency and works without it (verified with pnpm 11.1.2, 2026-11-07).
  esbuild: false
  # simple-git-hooks: its postinstall only installs the git hooks, which the root `prepare` script
  # (`simple-git-hooks`) already does on every `pnpm install` (ADR 0002).
  simple-git-hooks: false
